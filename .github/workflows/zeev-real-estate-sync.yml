name: Zeev Real Estate Daily
on:
  workflow_dispatch:
    inputs:
      links_only:
        description: 'Conferir apenas vinculos adiados e pendentes, sem repetir a varredura'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zeev-real-estate-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Discover Real Estate candidates for approval
        env:
          ZEEV_TOKEN: ${{ secrets.ZEEV_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://hjccxfznojjosvanwztv.supabase.co
          ZEEV_BASE_URL: https://raizeducacao.zeev.it
          RE_MAX_PAGES: '120'
          RE_LINKS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.links_only && '1' || '0' }}
        run: node scripts/zeev-real-estate-sync.cjs
