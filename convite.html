<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer"><title>Convite | Obras e Real Estate</title>
 <style>
  *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(135deg,#fff5e7,#f4faf6 65%,#e5f1ed);color:#153e36;font:16px/1.5 Arial,sans-serif;display:grid;place-items:center;padding:24px}main{width:100%;max-width:480px}small{color:#56736b}h1{font-size:28px;line-height:1.2;margin:16px 0}button{border:0;border-radius:6px;background:#176c60;color:white;padding:14px 22px;font:inherit;cursor:pointer;min-height:48px}button:disabled{opacity:.6;cursor:wait}a{color:#176c60}#status{min-height:48px;overflow-wrap:anywhere}footer{margin-top:28px;font-size:14px}
 </style>
</head>
<body><main><small>RAIZ EDUCA&Ccedil;&Atilde;O</small><h1>Obras e Real Estate</h1><p>Seu convite n&atilde;o tem prazo de validade. Ative o acesso autorizado para o seu e-mail.</p><button id="open" type="button">Ativar meu acesso</button><p id="status" role="status" aria-live="polite"></p><footer>J&aacute; ativou sua conta? <a href="/">Entrar na plataforma</a></footer></main>
<script>
 'use strict';
 const parts=location.hash.slice(1).split('.'),button=document.getElementById('open'),status=document.getElementById('status');
 // Keep the secret in the fragment: it is not sent in HTTP requests or referrers.
 if(parts.length!==2||!/^[a-f0-9-]{36}$/i.test(parts[0])||!/^[a-f0-9]{64}$/.test(parts[1])){button.disabled=true;status.textContent='Link incompleto. Abra o convite recebido por e-mail.';}
 button.addEventListener('click',async()=>{
  button.disabled=true;status.textContent='Verificando seu convite...';
  try{
   const response=await fetch('https://hjccxfznojjosvanwztv.supabase.co/functions/v1/access-invite-open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:parts[0],token:parts[1]}),signal:AbortSignal.timeout(30000)});
   const data=await response.json();if(!response.ok)throw Error(data.error||'Nao foi possivel abrir o convite.');
   const target=new URL(data.url);if(target.origin!=='https://hjccxfznojjosvanwztv.supabase.co'||target.pathname!=='/auth/v1/verify')throw Error('Destino de acesso invalido.');
   location.replace(target.href);
  }catch(error){status.textContent=error.message||'Falha na conexao. Tente novamente.';button.disabled=false;}
 });
</script></body></html>
